<!-- index.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceOfSign - نظام الترجمة الفورية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        /* الثيم الداكن (الافتراضي) */
        body.dark-mode { background-color: #0b0f19; color: #f3f4f6; }
        body.dark-mode .container {
            background: #111827;
            border: 1px solid #1f2937;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        body.dark-mode h2 { color: #00f2fe; }
        body.dark-mode #textBox { background-color: #1f2937; border: 2px solid #374151; color: #ffffff; }
        body.dark-mode #textBox.listening { border-color: #00f2fe; }
        body.dark-mode .mic-btn { background-color: #374151; color: white; }
        body.dark-mode .theme-btn { background-color: #1f2937; color: #fbbf24; border: 1px solid #374151; }
        body.dark-mode .status { color: #9ca3af; }
        body.dark-mode .footer-credits { color: #6b7280; }

        /* الثيم الفاتح */
        body.light-mode { background-color: #f3f4f6; color: #111827; }
        body.light-mode .container {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        body.light-mode h2 { color: #0284c7; }
        body.light-mode #textBox { background-color: #f9fafb; border: 2px solid #d1d5db; color: #1f2937; }
        body.light-mode #textBox.listening { border-color: #0284c7; }
        body.light-mode .mic-btn { background-color: #e5e7eb; color: #1f2937; }
        body.light-mode .theme-btn { background-color: #e5e7eb; color: #d97706; border: 1px solid #d1d5db; }
        body.light-mode .status { color: #4b5563; }
        body.light-mode .footer-credits { color: #9ca3af; }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            text-align: center;
            padding: 30px;
            border-radius: 20px;
            position: relative;
        }

        .theme-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            transition: transform 0.2s;
        }
        .theme-btn:hover { transform: scale(1.1); }

        h2 { margin-bottom: 25px; font-size: 24px; font-weight: 700; }

        #textBox {
            width: 100%;
            min-height: 180px;
            border-radius: 14px;
            font-size: 26px;
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .mic-btn {
            border: none;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            outline: none;
            margin-bottom: 15px;
        }
        .mic-btn:hover { transform: scale(1.05); }
        .mic-btn.active {
            background-color: #ef4444 !important;
            color: white !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .status {
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .indicator {
            height: 10px;
            width: 10px;
            background-color: #9ca3af;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.3s;
        }
        .indicator.active { background-color: #10b981; box-shadow: 0 0 8px #10b981; }

        .footer-credits {
            font-size: 13px;
            letter-spacing: 0.5px;
            border-top: 1px dashed rgba(156, 163, 175, 0.2);
            padding-top: 15px;
            margin-top: 10px;
        }
    </style>
</head>
<body class="dark-mode">

    <div class="container">
        <button id="themeBtn" class="theme-btn" title="تغيير المظهر">
            <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>

        <h2>نافذة الحوار / Dialogue Window</h2>

        <div id="textBox">اضغط على زر الميكروفون للبدء في الاستماع...</div>

        <button id="micButton" class="mic-btn" title="تشغيل / إيقاف الميكروفون">
            <i id="micIcon" class="fa-solid fa-microphone-slash"></i>
        </button>

        <div class="status">
            <span id="indicator" class="indicator"></span>
            <span id="statusText">الميكروفون متوقف</span>
        </div>

        <div class="footer-credits">
            Designed & Developed by <strong>Duaa Duzan</strong> & <strong>Lames Bagdadi</strong>
        </div>
    </div>

    <!-- External script: inline scripts and onclick="" are blocked inside Chrome extensions -->
    <script src="index.js"></script>
</body>
</html>
