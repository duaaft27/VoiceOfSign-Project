<!-- connect.html — Bluetooth pairing window (same design as popup.html) -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Voice of Sign - الاتصال بالقفاز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: 'Cairo', sans-serif;
    }
    html { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); }
    body {
      max-width: 360px;
      margin: 0 auto;
      padding: 16px;
      color: #1e293b;
      box-sizing: border-box;
    }
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(203, 213, 225, 0.6);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    h2 { font-size: 15px; font-weight: 700; color: #0f172a; margin: 0; }

    .status-box, .output-screen, button { border-radius: 12px; }
    .status-box, .output-screen {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 12px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
      margin-bottom: 12px;
    }
    .status-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
    }
    .indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
      display: inline-block;
    }
    .indicator.connected {
      background-color: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
      color: white;
      border: none;
      padding: 11px;
      font-family: 'Cairo', sans-serif;
      font-size: 13px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.25);
      margin: 4px 0 12px;
    }
    button:hover { opacity: 0.95; transform: translateY(-1px); }
    .output-screen {
      background: rgba(15, 23, 42, 0.85);
      color: #f8fafc;
      min-height: 65px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
      line-height: 1.4;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .hint { font-size: 12px; color: #64748b; text-align: center; line-height: 1.6; margin: 0; }
  </style>
</head>
<body>
  <div class="header-container">
    <h2>صَوْت الإِشَارَة (VoS)</h2>
  </div>

  <div class="status-box">
    <span>حالة القفاز: <b id="statusText">غير متصل</b></span>
    <span id="statusIndicator" class="indicator"></span>
  </div>
    <p class="hint" id="backendStatus">خادم التعرف: متوقف</p>
  <button id="connectBtn">بحث عن القفاز (Bluetooth)</button>

  <div class="output-screen" id="translationOutput">في انتظار تفعيل الإشارة...</div>

  <p class="hint">أبقِ هذه النافذة مفتوحة (يمكنك تصغيرها) حتى يبقى القفاز متصلاً.</p>

  <script src="connect.js"></script>
</body>
</html>
